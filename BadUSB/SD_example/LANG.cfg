# Mapa znaków dla badusb.ino (opcjonalna).
#
# Pozwala przemapowac pojedyncze bajty wejsciowe na inne kody/klawisze przed
# wyslaniem do hosta - przydatne, gdy host nie uzywa ukladu klawiatury US.
#
# Format: po jednym wpisie w linii, trzy liczby dziesietne oddzielone przecinkami:
#   in,modifier,out
#     in       - kod bajtu wejsciowego 0-255 (tak jak czytany z payloadu, np. ze STRING)
#     modifier - klawisz wciskany razem z "out" (0 = brak)
#     out      - kod bajtu/klawisza faktycznie wysylanego do hosta
#
# Kody modyfikatorow (z badusb.ino):
#   128 KEY_LEFT_CTRL   129 KEY_LEFT_SHIFT   130 KEY_LEFT_ALT    131 KEY_LEFT_GUI
#   132 KEY_RIGHT_CTRL  133 KEY_RIGHT_SHIFT  134 KEY_RIGHT_ALT (AltGr)  135 KEY_RIGHT_GUI
#
# Linie puste oraz zaczynajace sie od '#' sa pomijane.
# Maksymalnie 64 wpisy. Brak aktywnych wpisow => brak przemapowania (passthrough).
#
# UWAGA - ograniczenie: convertLangChar() dziala na POJEDYNCZYCH bajtach, wiec
# mozna mapowac tylko znaki jednobajtowe (0-255). Wieloznakowe znaki UTF-8
# (np. polskie 'a' z ogonkiem = 0xC4 0x85) NIE zadzialaja przez ten mechanizm
# bez zmiany w kodzie - payloady trzymaj w ASCII.
#
# Przyklad (odkomentuj, by uzyc): zamiana Y/Z dla hosta z ukladem QWERTZ (np. niemieckim),
# gdzie fizyczne klawisze Y i Z sa zamienione miejscami wzgledem US:
# 121,0,122    # 'y' => wyslij 'z'
# 122,0,121    # 'z' => wyslij 'y'
# 89,0,90      # 'Y' => wyslij 'Z'
# 90,0,89      # 'Z' => wyslij 'Y'
